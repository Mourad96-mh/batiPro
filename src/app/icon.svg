<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Favicon = le symbole BATIPRO (cf. BrandMark.js) : « A » plein, pic orange
       et double courbe. Inversé sur la tuile navy de la marque pour rester
       lisible dans les onglets clairs comme sombres. Palette : globals.css. -->
  <rect width="64" height="64" rx="13" fill="#0b2a5c"/>
  <g transform="translate(32 33) scale(0.36) translate(-80 -71)">
    <!-- « A » plein évidé -->
    <path d="M84 12 L134 92 L34 92 Z M84 38 L114 92 L54 92 Z" fill="#ffffff" fill-rule="evenodd"/>
    <!-- pic orange -->
    <path d="M84 66 L96 92 L72 92 Z" fill="#f5820c"/>
    <!-- courbe blanche -->
    <path d="M2 120 C 46 98, 106 84, 158 92 C 108 96, 48 108, 2 120 Z" fill="#ffffff"/>
    <!-- courbe orange -->
    <path d="M8 130 C 50 110, 104 96, 146 100 C 104 106, 50 118, 8 130 Z" fill="#f5820c"/>
  </g>
</svg>
